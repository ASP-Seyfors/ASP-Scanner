<!-- SETTINGS PAGE -->
<div id="screenSettings" style="display: none;" class="card">
  <div class="flex-between" style="border-bottom: 2px solid #8b8589; padding-bottom: 6px; margin-bottom: 15px;">
    <h2 style="border:none; margin:0; padding:0;">ASP IMS - Settings</h2>
    <button class="btn-small btn-cancel btn-auto" onclick="SessionManager.closeSettings()" title="Return to the Home Screen."><i data-lucide="arrow-left" style="width:16px; height:16px; vertical-align:middle; margin-right:4px;"></i>Return</button>
  </div>

  <div class="form-row">
    <div class="form-label">App Theme:</div>
    <div class="input-wrapper">
      <select id="themeSelect" onchange="UIManager.changeAppTheme(this.value)">
        <option value="gold">ASP Classic (Light - Website Match)</option>
        <option value="slate">ASP Midnight (True Dark Mode)</option>
        <option value="sage">ASP Twilight (Hybrid Navy)</option>
      </select>
    </div>
  </div>

  <div class="form-row">
    <div class="form-label">Font Size:</div>
    <div class="input-wrapper">
      <select id="fontSizeSelect" onchange="UIManager.changeFontSize(this.value)">
        <option value="small">Small (85%)</option>
        <option value="medium" selected>Medium (100% - Default)</option>
        <option value="large">Large (115%)</option>
      </select>
    </div>
  </div>

  <div class="form-row" style="margin-top: 15px; border-top: 1px solid #eee; padding-top: 15px;">
    <div class="form-label">User Manual:</div>
    <div class="input-wrapper">
      <button class="btn-action btn-auto" style="background-color: #0277bd; color: #fff; margin:0; width: 100%; padding: 8px;" onclick="UIManager.openHelpScreen()"><i data-lucide="book-open" style="width:18px; height:18px; vertical-align:middle; margin-right:4px;"></i>Operations Guide</button>
    </div>
  </div>

  <div class="form-row" style="margin-top: 20px;">
    <div class="form-label" id="appVersionDisplay">App Version: v4.6.0</div>    
    <div class="input-wrapper" style="display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%;">
      <div>
        <button class="btn-small btn-auto" style="background-color: #0277bd; color: #ffffff; margin-left: 10px;" onclick="checkAppUpdates()"><i data-lucide="refresh-cw" style="width:16px; height:16px; vertical-align:middle; margin-right:4px;"></i>Check for Updates</button>
      </div>
      <button class="btn-small btn-cancel btn-auto" onclick="AuthManager.logout()"><i data-lucide="log-out" style="width:16px; height:16px; vertical-align:middle; margin-right:4px;"></i>Log Out</button>
    </div>
  </div>
</div>
